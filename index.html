<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gamesinclass</title>
  <meta name="description" content="Games for class — the full library, fast.">
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <h1 class="logo">games<span>in</span>class</h1>
    <label class="search-box">
      <span class="visually-hidden">Search games</span>
      <input id="search" type="search" placeholder="Search games…" autocomplete="off">
    </label>
  </header>

  <main>
    <!-- Ron's call, 2026-11-24: no favourites section, no separate daily
         section — just the games list on its own. Krillion and the other
         daily-game links are parked in DAILY_GAMES_SHORTLIST.md and can
         return as plain entries in data/games.json if he ever wants them. -->
    <section id="all" aria-labelledby="all-heading">
      <h2 id="all-heading">🎮 All games <span id="game-count" class="count"></span></h2>
      <div id="game-grid" class="grid"></div>
      <p id="no-results" class="no-results" hidden>No games match that search.</p>
      <div class="load-more-row">
        <button id="load-more" type="button" hidden>Load more games</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Rebuilt 2026-11-24. The old homepage is archived at
       <a href="archive/legacy-index-2026-11-23.html">archive/legacy-index-2026-11-23.html</a>.</p>
  </footer>
</body>
</html>
